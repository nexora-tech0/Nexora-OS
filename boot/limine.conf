# Nexora OS boot menu (Limine v11). Paths are relative to the boot volume (ISO or ESP).
# The default entry automatically opens Setup; the full desktop and application set is installed
# to disk and is not launched from the installation media. Entries also load the live system
# files, kernel symbols and install image (the boot loader, kernel and symbols Setup copies to EFI).
# `hz.test=<name>`
# entries provoke failures on purpose (init/diag.c); `hz.log=trace` enables verbose serial
# logging. Installed systems get their own limine.conf from Setup (user/apps/setup).
timeout: 3
interface_branding: Nexora OS Boot Manager
interface_branding_colour: 6
interface_help_hidden: yes
term_background: 0010122A
term_foreground: E8EAF6

${KERNEL}=boot():/boot/hzkrnl.elf
${RAMDISK}=boot():/boot/ramdisk.tar
${SYMBOLS}=boot():/boot/hzkrnl.sym
${INSTALL}=boot():/boot/install.tar

/Install Nexora OS
    comment: Automatically opens the Nexora OS installer. The full desktop is installed to disk.
    protocol: limine
    path: ${KERNEL}
    cmdline: hz.installer=1
    module_path: ${RAMDISK}
    module_string: ramdisk
    module_path: ${SYMBOLS}
    module_string: symbols
    module_path: ${INSTALL}
    module_string: install

/Install Nexora OS (verbose log)
    comment: Opens Setup with trace-level serial logging.
    protocol: limine
    path: ${KERNEL}
    cmdline: hz.installer=1 hz.log=trace
    module_path: ${RAMDISK}
    module_string: ramdisk
    module_path: ${SYMBOLS}
    module_string: symbols
    module_path: ${INSTALL}
    module_string: install

